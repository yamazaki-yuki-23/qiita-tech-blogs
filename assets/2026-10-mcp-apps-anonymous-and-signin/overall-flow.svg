<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>

  <rect x="40" y="40" width="250" height="64" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="165" y="68" font-size="18" font-weight="bold" text-anchor="middle" fill="#0d47a1">ホスト</text>
  <text x="165" y="92" font-size="14" text-anchor="middle" fill="#0d47a1">ChatGPT など</text>

  <rect x="370" y="40" width="250" height="64" rx="10" fill="#f5f5f5" stroke="#424242" stroke-width="2"/>
  <text x="495" y="68" font-size="18" font-weight="bold" text-anchor="middle" fill="#212121">Worker</text>
  <text x="495" y="92" font-size="14" text-anchor="middle" fill="#424242">/mcp で受ける</text>

  <line x1="290" y1="72" x2="366" y2="72" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="328" y="62" font-size="13" text-anchor="middle" fill="#333">tool を呼ぶ</text>

  <polygon points="495,140 625,205 495,270 365,205" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="495" y="198" font-size="15" text-anchor="middle" fill="#5d4037">サインインが要る tool を</text>
  <text x="495" y="220" font-size="15" text-anchor="middle" fill="#5d4037">トークン無しで呼んだ？</text>
  <line x1="495" y1="104" x2="495" y2="136" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <rect x="690" y="173" width="240" height="64" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="810" y="200" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b5e20">MCP の処理へ渡す</text>
  <text x="810" y="224" font-size="13" text-anchor="middle" fill="#1b5e20">検索などは匿名のまま結果を返す</text>
  <line x1="625" y1="205" x2="686" y2="205" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
  <text x="656" y="195" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e7d32">いいえ</text>

  <rect x="370" y="340" width="250" height="64" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="495" y="367" font-size="16" font-weight="bold" text-anchor="middle" fill="#b71c1c">401 を返す</text>
  <text x="495" y="391" font-size="13" text-anchor="middle" fill="#b71c1c">WWW-Authenticate を添える</text>
  <line x1="495" y1="270" x2="495" y2="336" stroke="#c62828" stroke-width="2" marker-end="url(#ar)"/>
  <text x="515" y="308" font-size="14" font-weight="bold" fill="#c62828">はい</text>

  <rect x="40" y="340" width="250" height="64" rx="10" fill="#fff" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="165" y="367" font-size="15" text-anchor="middle" fill="#333">ホストが</text>
  <text x="165" y="390" font-size="15" text-anchor="middle" fill="#333">サインインを求める</text>
  <line x1="370" y1="372" x2="294" y2="372" stroke="#c62828" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="40" y="190" width="250" height="84" rx="10" fill="#fff" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="165" y="226" font-size="15" text-anchor="middle" fill="#333">利用者が許可して</text>
  <text x="165" y="250" font-size="15" text-anchor="middle" fill="#333">Google でサインイン</text>
  <line x1="165" y1="340" x2="165" y2="278" stroke="#c62828" stroke-width="2" marker-end="url(#ar)"/>

  <line x1="165" y1="190" x2="165" y2="108" stroke="#1565c0" stroke-width="2" marker-end="url(#a)"/>
  <text x="178" y="140" font-size="13" fill="#0d47a1">トークンを受け取り、</text>
  <text x="178" y="160" font-size="13" fill="#0d47a1">トークン付きで呼び直す</text>

  <text x="40" y="450" font-size="12" fill="#666">点線の枠はサインインの流れ。呼び直したときはトークンがあるので「いいえ」へ進む</text>
</svg>
